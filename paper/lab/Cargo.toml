[package]
name = "phast-r-lab"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimental harness for PHast-R (see ../NOTES.md)"

[lib]
name = "lab"

[dependencies]
# Reference implementation of PHast/PHast+ (Beling), from the fork with hidden
# analysis accessors and a fix of the multithreaded construction (commit
# d0954d2 of vigna/bsuccinct-rs, branch sux, on top of upstream aa497a8 of
# October 8, 2026). TODO: replace the path with
# git = "https://github.com/vigna/bsuccinct-rs", rev = "d0954d2..."
ph = { path = "../../../bsuccinct-rs/ph", features = ["wyhash", "gxhash"] }
# PtrHash (Groot Koerkamp), from a local clone (v2.1.2); TODO: replace the
# path with the corresponding git revision
ptr_hash = { path = "../../../PTRHash" }
# cli provides init_env_logger
sux = { path = "../..", features = ["epserde", "cli"] }
clap = { version = "4", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
gxhash = "3.5"
value-traits = "0.3.0"
dsi-progress-logger = "0.8"
mem_dbg = "0.4"
rayon = "1.12"

[profile.release]
opt-level = 3
debug = true
codegen-units = 1
lto = "thin"

# Standalone workspace, independent of the sux package.
[workspace]
